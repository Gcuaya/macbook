name: Monitor MacBook Pro M5

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Enviar correo de prueba"
        required: true
        default: true
        type: boolean
  schedule:
    # Cada hora, minuto 17. GitHub interpreta cron en UTC.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: macbook-m5-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email || 'false' }}
        run: python monitor.py

      - name: Guardar historial de avisos
        if: github.event_name != 'workflow_dispatch'
        run: |
          if git diff --quiet -- state.json; then
            echo "No hay cambios en el historial."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Actualizar historial de ofertas notificadas"
            git push
          fi
